name: Release

# Tag v<version> (matching every version file) to publish. npm uses trusted publishing (OIDC): no token is stored.

permissions: {}

on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g pnpm@9.15.9
      - run: pnpm install --frozen-lockfile
      - name: Tag matches every version file
        run: |
          V=$(node -p "require('./package.json').version")
          [ "refs/tags/v$V" = "$GITHUB_REF" ] || { echo "::error::tag $GITHUB_REF != v$V"; exit 1; }
          for f in server.json .claude-plugin/plugin.json; do
            FV=$(node -p "require('./$f').version")
            [ "$FV" = "$V" ] || { echo "::error::$f is $FV, package.json is $V"; exit 1; }
          done
          SV=$(node -p "require('./server.json').packages[0].version")
          [ "$SV" = "$V" ] || { echo "::error::server.json package version is $SV"; exit 1; }
          grep -q "export const VERSION = \"$V\"" src/version.ts || { echo "::error::src/version.ts does not say $V"; exit 1; }
      - run: pnpm run check
      - name: Publish to npm (trusted publishing, provenance)
        run: npm publish --access public --provenance
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Mock Anything $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for npm to show this version
        run: |
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            [ "$(npm view mockanything version 2>/dev/null)" = "$V" ] && { echo "npm has $V"; exit 0; }
            echo "waiting for npm ($i/30)"; sleep 20
          done
          echo "::warning::npm did not show $V in time; publishing to the registry anyway"
      - name: Install mcp-publisher (pinned)
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
      - name: Login via GitHub OIDC and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
