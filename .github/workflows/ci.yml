name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm audit --prod --audit-level high
      - name: Smoke CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js list
          for f in packs/*.yaml; do node dist/cli.js validate "$f"; done
      - name: Pack dry run
        run: npm pack --dry-run
